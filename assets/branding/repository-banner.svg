  <circle cx="542" cy="478" r="15" fill="#F1FFFA"/>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#233c48">
<text x="214" y="145" font-size="72" font-weight="700" letter-spacing="-3">Glim</text>
<text x="82" y="240" font-size="43" font-weight="600" letter-spacing="-1">The all-purpose viewer for the AI era.</text>
<text x="84" y="290" font-size="23" fill="#56717a">Code. Documents. Data. Git. One native workspace.</text>
